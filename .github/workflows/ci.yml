name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        if: runner.os == 'Windows'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: test
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.log
      - name: test summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### Failed tests on ${{ runner.os }}"
            echo '```'
            grep -E -B 30 -- '^--- FAIL' test.log | grep -vE '^20[0-9]{2}/' | tail -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: build
        run: go build -o stratum-${{ runner.os }} .
