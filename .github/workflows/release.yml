name: release

# Push a tag like v0.4.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o out/stratum-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o out/stratum-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o out/stratum-linux-arm64 .
          cd out && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
